name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
          - os: macos-13
            label: macos-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-2022
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: cargo-${{ matrix.label }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.label }}-

      - name: Install tauri-cli
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Configure npm shell (Windows)
        if: runner.os == 'Windows'
        run: npm config set script-shell bash

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        # Remove node_modules and lock file so npm install resolves
        # fresh platform-specific rollup optional deps (npm/cli#4828).
        # Use bash shell for `rm -rf` compatibility on Windows.
        run: rm -rf node_modules package-lock.json && npm install
        working-directory: apps/web
        shell: bash

      - name: Build and bundle
        run: npm run build:desktop
        env:
          PIZZA_VENDOR_TOOL_TARGETS: current

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pizza-${{ matrix.label }}
          path: |
            apps/desktop/target/release/bundle/**/*.dmg
            apps/desktop/target/release/bundle/**/*.deb
            apps/desktop/target/release/bundle/**/*.rpm
            apps/desktop/target/release/bundle/**/*.AppImage
            apps/desktop/target/release/bundle/**/*.msi
            apps/desktop/target/release/bundle/**/*.exe
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
          generate_release_notes: true
          draft: true
